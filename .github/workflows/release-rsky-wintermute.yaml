name: release-rsky-wintermute

# Publishes prebuilt rsky-wintermute binaries as a GitHub release so hosts
# install a CI-built artifact instead of compiling on the box. Every push to
# eurosky that can change the binary cuts a release tagged
# rsky-wintermute-<UTC datetime>, the same scheme the rsky-pds images use.
# Pull requests build the tarball as a workflow artifact only.
on:
  push:
    branches:
      - eurosky
    paths:
      # wintermute pulls in the shared rsky-* crates by path.
      - 'rsky*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - '.github/workflows/release-rsky-wintermute.yaml'
  pull_request:
    paths:
      - 'rsky-wintermute/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - '.github/workflows/release-rsky-wintermute.yaml'
  workflow_dispatch:

env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'eurosky-social/rsky'
    timeout-minutes: 60
    # The appview hosts run Debian 12 (glibc 2.36). Building on the runner's
    # newer glibc produces binaries that refuse to start there.
    container: rust:1.86-bookworm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        # aws-lc-sys falls back to cmake when its cc build is unavailable.
        run: apt-get update && apt-get install -y --no-install-recommends cmake jq

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rsky-wintermute-release

      - name: Build
        run: cargo build --release --locked --package rsky-wintermute

      - name: Package
        id: meta
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 \
            | jq '.packages[] | select(.name == "rsky-wintermute")')
          version=$(jq -r .version <<< "$pkg")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Every [[bin]] of the crate, including the ops tooling
          # (direct_index, firehose_catchup, ...).
          bins=$(jq -r '.targets[] | select(.kind[] == "bin") | .name' <<< "$pkg")

          dir="rsky-wintermute-${TARGET}"
          mkdir -p "dist/${dir}"
          for bin in $bins; do
            cp "target/release/${bin}" "dist/${dir}/"
          done
          cd "dist/${dir}"
          sha256sum * > SHA256SUMS
          cd ..
          tar -czf "${dir}.tar.gz" "${dir}"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          cat "${dir}/SHA256SUMS"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: rsky-wintermute-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: rsky-wintermute-${{ env.TARGET }}
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.ref_name != 'eurosky' && format('{0}-', github.ref_name) || '' }}
        run: |
          tag="rsky-wintermute-${BRANCH}$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          notes="rsky-wintermute ${VERSION} built from ${GITHUB_SHA} for ${TARGET} (Debian 12 / glibc 2.36)."
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "rsky-wintermute ${VERSION} (${GITHUB_SHA::7})" \
            --notes "$notes"
